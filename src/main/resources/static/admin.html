<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Matrículas 2027</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header-admin {
            background-color: #002060;
            color: white;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f4f9;
        }
        .badge-matriculada {
            background-color: #198754;
        }
        .badge-pendiente {
            background-color: #ffc107;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="header-admin py-3 mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <img src="assets/logo.png" alt="Logo" style="height: 45px;" onerror="this.style.display='none'">
                <div>
                    <h5 class="mb-0 fw-bold">ESCUELA DE NIÑAS ARTURO ALESSANDRI</h5>
                    <small class="text-light opacity-75">Sistema Gestor de Pre-Matrículas 2027</small>
                </div>
            </div>
            <div>
                <button onclick="cargarMatriculas()" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
                <a href="index.html" class="btn btn-light btn-sm fw-bold text-dark">
                    <i class="bi bi-plus-circle"></i> Nueva Ficha
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container">
        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <label class="form-label fw-bold small text-muted mb-1">Buscar por Alumna o Folio</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="inputBuscar" class="form-control" placeholder="Nombre, RUT o Folio..." onkeyup="filtrarTabla()">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted mb-1">Filtrar por Curso</label>
                        <select id="selectFiltroCurso" class="form-select" onchange="filtrarTabla()">
                            <option value="">Todos los Cursos</option>
                            <option value="PRE-KINDER A">PRE-KINDER A</option>
                            <option value="PRE-KINDER B">PRE-KINDER B</option>
                            <option value="KINDER A">KINDER A</option>
                            <option value="KINDER B">KINDER B</option>
                            <option value="1°A">1°A</option>
                            <option value="1°B">1°B</option>
                            <option value="2°A">2°A</option>
                            <option value="2°B">2°B</option>
                            <option value="3°A">3°A</option>
                            <option value="3°B">3°B</option>
                            <option value="4°A">4°A</option>
                            <option value="4°B">4°B</option>
                            <option value="5°A">5°A</option>
                            <option value="5°B">5°B</option>
                            <option value="6°A">6°A</option>
                            <option value="6°B">6°B</option>
                            <option value="7°A">7°A</option>
                            <option value="7°B">7°B</option>
                            <option value="8°A">8°A</option>
                            <option value="8°B">8°B</option>
                        </select>
                    </div>

                    <div class="col-md-3 text-md-end pt-3 pt-md-0">
                        <span class="badge bg-secondary p-2 me-1" id="lblTotal">Total: 0</span>
                        <span class="badge badge-matriculada p-2 me-1" id="lblMatriculadas">Matriculadas: 0</span>
                        <span class="badge badge-pendiente p-2" id="lblPendientes">Pendientes: 0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3" style="width: 15%;">Folio</th>
                                <th style="width: 40%;">Nombre de la Alumna</th>
                                <th style="width: 20%;">Curso</th>
                                <th class="text-center" style="width: 15%;">Estado</th>
                                <th class="text-center pe-3" style="width: 10%;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMatriculasBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                                    Cargando registros...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let listaMatriculasGlobal = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarMatriculas();
        });

        function val(texto) {
            if (!texto || texto === 'null' || texto === 'undefined') return '';
            return String(texto).trim();
        }

        async function cargarMatriculas() {
            const tbody = document.getElementById('tablaMatriculasBody');
            try {
                const response = await fetch('/api/matriculas');
                if (!response.ok) throw new Error('Error HTTP: ' + response.status);

                listaMatriculasGlobal = await response.json();
                filtrarTabla();
            } catch (error) {
                console.error('Error al cargar matrículas:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4 text-danger">
                            <i class="bi bi-exclamation-triangle-fill"></i> No se pudo conectar con el servidor.
                        </td>
                    </tr>`;
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tablaMatriculasBody');
            tbody.innerHTML = '';

            if (!Array.isArray(lista)) lista = [];

            document.getElementById('lblTotal').innerText = `Total: ${lista.length}`;
            const matriculadas = lista.filter(m => (m?.estadoFicha || m?.estado) === 'MATRICULADA').length;
            document.getElementById('lblMatriculadas').innerText = `Matriculadas: ${matriculadas}`;
            document.getElementById('lblPendientes').innerText = `Pendientes: ${lista.length - matriculadas}`;

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No se encontraron matrículas.</td></tr>`;
                return;
            }

            lista.forEach(m => {
                if (!m) return;

                const alu = m.alumna || {};
                const nomAlumna = [val(alu?.nombres), val(alu?.apellidoPaterno), val(alu?.apellidoMaterno)]
                    .filter(Boolean).join(' ') || 'Sin Nombre Registrado';
                const rutAlumna = val(alu?.rut) || '---';

                const estadoActual = m.estadoFicha || m.estado;
                const esMatriculada = estadoActual === 'MATRICULADA';
                const badgeEstado = esMatriculada
                    ? '<span class="badge badge-matriculada">MATRICULADA</span>'
                    : '<span class="badge badge-pendiente">PENDIENTE</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-3 fw-bold text-primary">${val(m.numeroMatricula) || '---'}</td>
                    <td>
                        <div class="fw-bold">${nomAlumna}</div>
                        <small class="text-muted">RUT: ${rutAlumna}</small>
                    </td>
                    <td><span class="badge bg-light text-dark border px-3 py-2 fs-6">${val(m.cursoActual) || '---'}</span></td>
                    <td class="text-center">${badgeEstado}</td>
                    <td class="text-center pe-3">
                        <div class="btn-group" role="group">
                            <button class="btn btn-sm btn-outline-primary" title="Editar Ficha" onclick="editarFicha(${m.id})">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" title="Descargar Word" onclick="descargarWord(${m.id})">
                                <i class="bi bi-file-earmark-word-fill"></i>
                            </button>
                            <button class="btn btn-sm ${esMatriculada ? 'btn-outline-warning' : 'btn-success'}" 
                                    title="${esMatriculada ? 'Marcar como Pendiente' : 'Marcar como Matriculada'}" 
                                    onclick="cambiarEstado(${m.id}, '${esMatriculada ? 'PENDIENTE' : 'MATRICULADA'}')">
                                <i class="bi ${esMatriculada ? 'bi-arrow-counterclockwise' : 'bi-check-circle-fill'}"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabla() {
            const textoQuery = document.getElementById('inputBuscar').value.toLowerCase().trim();
            const cursoSeleccionado = document.getElementById('selectFiltroCurso').value.toUpperCase().trim();

            const filtradas = listaMatriculasGlobal.filter(m => {
                if (!m) return false;

                const alu = m.alumna || {};
                const textoAlumna = `${val(alu?.nombres)} ${val(alu?.apellidoPaterno)} ${val(alu?.apellidoMaterno)} ${val(alu?.rut)}`.toLowerCase();
                const folio = val(m.numeroMatricula).toLowerCase();
                const cursoMatricula = val(m.cursoActual).toUpperCase().trim();

                const coincideTexto = textoAlumna.includes(textoQuery) || folio.includes(textoQuery);
                const coincideCurso = (cursoSeleccionado === "") || (cursoMatricula === cursoSeleccionado);

                return coincideTexto && coincideCurso;
            });

            renderizarTabla(filtradas);
        }

        function editarFicha(id) {
            window.location.href = `editar-matricula.html?id=${id}`;
        }

        function imprimirFicha(idMatricula) {
            const url = `/api/matriculas/${idMatricula}/pdf`;
            const ventana = window.open(url, '_blank');
            if (!ventana) {
                alert("Por favor, permite las ventanas emergentes en tu navegador para visualizar el PDF.");
            }
        }

        function descargarWord(id) {
            window.location.href = `/api/matriculas/${id}/word`;
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                const res = await fetch(`/api/matriculas/${id}/estado`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: nuevoEstado })
                });

                if (res.ok) {
                    cargarMatriculas();
                } else {
                    alert('No se pudo actualizar el estado.');
                }
            } catch (err) {
                alert('Error de conexión al cambiar el estado.');
            }
        }
    </script>
</body>
</html>

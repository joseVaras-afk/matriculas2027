<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Funcionarios - Escuela Arturo Alessandri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 400px;">
            <div class="card-body p-4">
                <h4 class="text-center fw-bold mb-4">Acceso Sistema Matrículas</h4>
                
                <!-- Mensaje visual en caso de credenciales incorrectas -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                    Usuario o contraseña incorrectos.
                </div>

                <!-- Formulario enviado por POST directamente a /login -->
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="usuario" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Si Spring Security redirige con ?error, mostramos la alerta
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('errorAlert').classList.remove('d-none');
        }
    </script>
</body>
</html>

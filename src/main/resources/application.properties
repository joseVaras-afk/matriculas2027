spring.application.name=matricula2027
# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/matricula2027?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sistem12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===============================
# ¡Importante! 'update' crea las tablas si no existen y las actualiza si agregas campos.
# En producción suele usarse 'validate' o 'none'.
spring.jpa.hibernate.ddl-auto=update
# 2. Desactivar la búsqueda pesada de metadatos JDBC al iniciar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
#Optimizar el tiempo de espera de conexión HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0

# Mostrar las consultas SQL en la consola (Muy útil para ver cómo Spring crea las tablas)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server.port=8080

# ===============================
# CONFIGURACIÓN DE CORREO ELECTRÓNICO
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=arturoalessandrimatriculas@gmail.com
spring.mail.password=vwbk rnrb fjgj ifpj

# Propiedades de seguridad TLS y Autenticación
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Timeouts estrictos para JavaMailSender (evita acumular hilos congelados)
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

logging.level.org.springframework.web=DEBUG

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 1. Optimización del Pool de Conexiones a TiDB Cloud
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# 2. Ajuste de Tomcat para 1 CPU (Evita sobrecargar el procesador)
server.tomcat.threads.max=60
server.tomcat.threads.min-spare=15
server.tomcat.accept-count=200
server.tomcat.max-connections=2000